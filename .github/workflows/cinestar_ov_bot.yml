name: CineStar Konstanz OV Bot

on:
  schedule:
    # Every 6 hours (UTC). The runner is a laptop that may be asleep; a missed
    # or timed-out run is harmless, the next one catches up.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force_send:
        description: "Force Telegram send even if this week/hash was already recorded"
        required: false
        default: false
        type: boolean

concurrency:
  group: cinestar-ov-bot
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  run-bot:
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      TZ: Europe/Berlin
      # Outside the workspace: actions/checkout runs `git clean -ffdx`, which
      # wiped an in-repo .venv and forced a full pip download on every run.
      VENV: ${{ github.workspace }}/../.venv-cinestar
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Check Python
        run: python3 --version

      - name: Install dependencies
        timeout-minutes: 4
        run: |
          REQ_HASH=$(shasum -a 256 requirements.txt | cut -d' ' -f1)
          if [ ! -x "$VENV/bin/python" ] || [ "$(cat "$VENV/.req-hash" 2>/dev/null)" != "$REQ_HASH" ]; then
            rm -rf "$VENV"
            python3 -m venv "$VENV"
            "$VENV/bin/python" -m pip install --disable-pip-version-check \
              --timeout 20 --retries 3 -r requirements.txt
            echo "$REQ_HASH" > "$VENV/.req-hash"
          else
            echo "Reusing venv at $VENV"
          fi

      - name: Pull latest state
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

      - name: Run bot (send)
        run: |
          . "$VENV/bin/activate"
          if [ "${{ github.event.inputs.force_send || 'false' }}" = "true" ]; then
            python -m src.main --send --force
          else
            python -m src.main --send
          fi

      - name: Keep schedule alive
        # GitHub disables cron workflows in public repos after 60 days without
        # repo activity. Re-enabling via API resets that timer.
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/cinestar_ov_bot.yml/enable" \
            || echo "Keepalive call failed (non-fatal)."

      - name: Commit updated state (if changed)
        if: always()
        run: |
          git status --porcelain
          if git diff --quiet -- state/state.json; then
            echo "No state changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add state/state.json
          git commit -m "Update bot state [skip ci]"

          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi

            git rebase --abort || true
            echo "State push attempt ${attempt} failed, retrying..."
            sleep 5
          done

          echo "Failed to push updated state after retries."
          exit 1

      - name: Notify Telegram on failure
        # failure() only: timeouts/cancellations happen when the laptop sleeps
        # mid-run and are not worth a message.
        if: failure()
        timeout-minutes: 1
        run: |
          curl -fsS -m 20 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ CineStar-бот упал с ошибкой. Лог: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > /dev/null || true
